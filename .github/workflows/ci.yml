name: CI
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build + Vet + Test
        working-directory: go-backend
        run: |
          go build ./...
          go vet ./...
          go test ./...
